name: Minimal image

on:
  workflow_dispatch:
  push:
    tags: ["v*-minimal.*"]
  pull_request:
    branches: [feat/minimal]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - rustfs/**
      - deploy/minimal/**
      - .github/workflows/minimal-image.yml

permissions:
  contents: read

concurrency:
  group: minimal-image-${{ github.ref }}
  cancel-in-progress: false

env:
  MINIMAL_IMAGE: ghcr.io/mintuhouse/rustfs

jobs:
  build:
    if: github.repository == 'mintuhouse/rustfs'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read minimal version
        id: version
        run: echo "version=$(cat deploy/minimal/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/minimal/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.MINIMAL_IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=minimal-${{ matrix.arch }}
          cache-to: type=gha,scope=minimal-${{ matrix.arch }},mode=max
      - name: Test transfers, recovery, private access and CORS
        env:
          MINIMAL_ARCH: ${{ matrix.arch }}
        run: bash deploy/minimal/smoke.sh "$MINIMAL_IMAGE:sha-$GITHUB_SHA-$MINIMAL_ARCH"
      - name: Export tested image
        env:
          MINIMAL_ARCH: ${{ matrix.arch }}
        run: docker save "$MINIMAL_IMAGE:sha-$GITHUB_SHA-$MINIMAL_ARCH" | gzip > "$RUNNER_TEMP/$MINIMAL_ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.tar.gz
          retention-days: 2

  publish:
    if: github.repository == 'mintuhouse/rustfs' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/feat/minimal' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architectures and manifest
        shell: bash
        run: |
          version=$(cat deploy/minimal/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-minimal\.[0-9]+$ ]]
          tags=(--tag "$MINIMAL_IMAGE:sha-$GITHUB_SHA" --tag "$MINIMAL_IMAGE:minimal")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ]
            if docker buildx imagetools inspect "$MINIMAL_IMAGE:$version" >/dev/null 2>&1; then
              echo "This version is already published. Bump VERSION and use a new tag." >&2
              exit 1
            fi
            tags+=(--tag "$MINIMAL_IMAGE:$version")
          fi
          digests=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/$arch.tar.gz"
            image="$MINIMAL_IMAGE:sha-$GITHUB_SHA-$arch"
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            digests+=("$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "$MINIMAL_IMAGE:sha-$GITHUB_SHA"
